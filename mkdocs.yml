site_name: IST Docs
site_description: Portal institucional de documentação da Info Service Technology
site_url: https://info-service-technology.github.io/ist-docs-portal/
repo_url: https://github.com/Info-Service-Technology/ist-docs-portal
repo_name: Info-Service-Technology/ist-docs-portal
strict: true
theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
plugins:
  - search
nav:
  - Início: index.md
  - Produtos: produtos.md
  - Sobre a documentação: sobre.md
